[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-enconvert"
version = "0.1.0"
description = "EnConvert reader for LlamaIndex: perceive URLs or ingest a whole site into Documents, every read scored."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "EnConvert", email = "support@enconvert.com" }]
keywords = ["llama-index", "enconvert", "rag", "reader", "markdown", "web", "ingest"]
dependencies = [
    "llama-index-core>=0.12,<0.15",
    "enconvert>=0.1",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://www.enconvert.com"
Repository = "https://github.com/enconvert/llama-index-readers-enconvert"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.llamahub]
contains-example = false
import_path = "llama_index.readers.enconvert"

[tool.llamahub.class_authors]
EnConvertReader = "enconvert"
